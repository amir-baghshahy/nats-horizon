name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git go nodejs npm upx tar openssh namcap \
            webkit2gtk-4.1 gtk3 libayatana-appindicator pkgconf

      - uses: actions/checkout@v4

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Show toolchain
        run: |
          go version
          wails version
          namcap --version

      - name: Build desktop app (Wails)
        env:
          CGO_ENABLED: "1"
        run: |
          wails build -platform linux/amd64 -tags webkit2_41 -o nats-horizon
          chmod +x nats-horizon

      - name: Compress binary with UPX
        run: upx --best --lzma nats-horizon

      - name: Package release tarball
        id: tar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/nats-horizon
          cp nats-horizon dist/nats-horizon/
          if [ -f .env.example ]; then
            cp .env.example dist/nats-horizon/.env.example
          fi
          if [ -f LICENSE ]; then
            cp LICENSE dist/nats-horizon/LICENSE
          fi
          ( cd dist && tar czf "../nats-horizon-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" nats-horizon )
          echo "tarball=$(pwd)/nats-horizon-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Lint the PKGBUILD with namcap
        run: |
          VERSION="${{ steps.tar.outputs.version }}"
          cp packaging/arch/PKGBUILD /tmp/PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${VERSION}|" /tmp/PKGBUILD
          sed -i "s|b2sums_x86_64=('PLACEHOLDER')|b2sums_x86_64=('SKIP')|" /tmp/PKGBUILD
          namcap /tmp/PKGBUILD

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tar.outputs.tarball }}

      - name: Publish AUR package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.tar.outputs.version }}
          TARBALL: ${{ steps.tar.outputs.tarball }}
        run: packaging/arch/publish-aur.sh
